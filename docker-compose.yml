services:
  biai-crm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biai-crm-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - crm-database:/app/prisma
    restart: unless-stopped

volumes:
  crm-database:
